server {
    listen 80;
    server_name nexusapi.center www.nexusapi.center;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://nexusapi.center$request_uri;
    }
}

# MinIO S3 endpoint. Keep the ACME challenge on HTTP so a certificate can be
# issued after s3.nexusapi.center is pointed at this server.
server {
    listen 80;
    server_name s3.nexusapi.center;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://s3.nexusapi.center$request_uri;
    }
}

# MinIO web console. Keep the ACME challenge on HTTP so a certificate can be
# issued after minio-console.nexusapi.center is pointed at this server.
server {
    listen 80;
    server_name minio-console.nexusapi.center;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://minio-console.nexusapi.center$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name minio-console.nexusapi.center;
    client_max_body_size 5g;

    ssl_certificate /etc/letsencrypt/live/minio-console.nexusapi.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio-console.nexusapi.center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl;
    server_name s3.nexusapi.center;
    client_max_body_size 5g;

    ssl_certificate /etc/letsencrypt/live/s3.nexusapi.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.nexusapi.center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl;
    server_name nexusapi.center www.nexusapi.center;
    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/nexusapi.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusapi.center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Neutral alias for the short-lived image challenge. The backend keeps
    # serving /api/v1/auth/captcha; this path avoids over-eager browser
    # privacy filters that block the literal word "captcha".
    location = /auth/challenge {
        proxy_pass http://app:8080/api/v1/auth/captcha;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Neutral image challenge alias for clients that filter auth/API keywords.
    location = /session/image {
        proxy_pass http://app:8080/api/v1/auth/captcha;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(api|v1|actuator|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://app:8080;
        client_body_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

underscores_in_headers on;
server {
    listen 80;
    server_name sub.nexusapi.center;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 256m;
        gzip off;
    }
}

server {
    listen 443 ssl;
    server_name sub.nexusapi.center;
    ssl_certificate /etc/letsencrypt/live/sub.nexusapi.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.nexusapi.center/privkey.pem;
    location / {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 256m;
        gzip off;
    }
}
