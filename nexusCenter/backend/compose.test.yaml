name: nexus-auth-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_api_test
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_api_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "nexus-test-password"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nexus-test-password", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

