spring:
  datasource:
    hikari:
      # 全量集成测试会缓存多个 Spring 上下文；限制每个上下文的连接池，
      # 避免测试本身耗尽隔离 PostgreSQL 的 max_connections。
      maximum-pool-size: 2
      minimum-idle: 0

nexus:
  security:
    # 测试专用 32 字节 Base64 密钥，禁止用于生产环境。
    field-encryption-key: bmV4dXMtdGVzdC1maWVsZC1rZXktMjAyNi0wMDAwMDA=
    lookup-hmac-key: bmV4dXMtdGVzdC1sb29rdXAta2V5LTIwMjYtMDAwMDA=
  request-log:
    # 集成测试同步落库，避免测试断言与生产遥测批处理线程发生竞态；生产默认 true。
    async-enabled: false
  system-access-token:
    active-hash-version: 1
    hmac-keys:
      1: c3lzdGVtLWFjY2Vzcy10b2tlbi10ZXN0LWtleS0wMDE=
    max-per-user: 10
  health:
    # 集成测试显式调用健康服务，关闭后台调度以避免测试夹具被并发探测。
    enabled: false
  model-sync:
    # 集成测试按需直接调用同步服务，避免后台轮询与测试夹具并发。
    scheduler-initial-delay: 1h
